


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Crosshair Main Elements -->
  <g stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Outer Segmented Ring -->
    <circle cx="64" cy="64" r="44" stroke-dasharray="20 10 30 10" />
    
    <!-- Inner Target Ring -->
    <circle cx="64" cy="64" r="18" stroke-dasharray="8 4" />
    
    <!-- Reticle Cross Lines -->
    <line x1="64" y1="10" x2="64" y2="38" />
    <line x1="64" y1="90" x2="64" y2="118" />
    <line x1="10" y1="64" x2="38" y2="64" />
    <line x1="90" y1="64" x2="118" y2="64" />

    <!-- Center Point -->
    <circle cx="64" cy="64" r="2.5" fill="#dc2626" />
  </g>

  <!-- Corner Tech Brackets -->
  <path d="M 16 28 V 16 H 28" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 112 28 V 16 H 100" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 16 100 V 112 H 28" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 112 100 V 112 H 100" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
