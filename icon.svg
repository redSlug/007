<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Dark Background -->
    <rect id="bg" width="128" height="128" rx="16" fill="#09090b" />
    
    <!-- Pulse Glow -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <use href="#bg" />

  <!-- Subtle Radar Grid Lines -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="64" cy="64" r="34" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Threatening Skull-inspired Silhouette -->
  <g fill="#18181b" stroke="#09090b" stroke-width="1">
    <!-- Head Outer -->
    <path d="M40 50 C40 32 50 24 64 24 C78 24 88 32 88 50 C88 62 82 70 76 76 L76 86 H52 L52 76 C46 70 40 62 40 50 Z" />
    <!-- Eye Cavities -->
    <path d="M46 50 Q54 46 58 54 Q52 58 46 50 Z" fill="#09090b" />
    <path d="M82 50 Q74 46 70 54 Q76 58 82 50 Z" fill="#09090b" />
  </g>

  <!-- Crosshair Interface -->
  <g stroke="#dc2626" stroke-width="1.5" fill="none" filter="url(#crimsonGlow)">
    <!-- Outer Ring Chunks -->
    <circle cx="64" cy="64" r="44" stroke-dasharray="20 10 30 10" />
    <!-- Inner Target Circle -->
    <circle cx="64" cy="64" r="18" stroke-dasharray="8 4" />
    
    <!-- Reticle Reticle Lines -->
    <line x1="64" y1="10" x2="64" y2="38" />
    <line x1="64" y1="90" x2="64" y2="118" />
    <line x1="10" y1="64" x2="38" y2="64" />
    <line x1="90" y1="64" x2="118" y2="64" />

    <!-- Center Lock Point -->
    <circle cx="64" cy="64" r="2" fill="#dc2626" />
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 16 26 V 16 H 26" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 112 26 V 16 H 102" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 16 102 V 112 H 26" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 112 102 V 112 H 102" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.8" />
</svg>


